name: Update Video Stats

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Prefetch video metadata
        run: node scripts/prefetch-all-meta.mjs
      
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet src/data/video-meta.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/video-meta.json
          git commit -m "🤖 auto: update video stats ($(date +'%Y-%m-%d %H:%M UTC'))"
          git push
      
      - name: Report status
        run: |
          if [ "${{ steps.check_changes.outputs.changed }}" == "true" ]; then
            echo "✅ 视频数据已更新并提交"
          else
            echo "ℹ️ 视频数据无变化，无需提交"
          fi
