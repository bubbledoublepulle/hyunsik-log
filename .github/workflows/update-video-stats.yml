name: Update YouTube Stats

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Auto-update YouTube stats
        env:
          VITE_YOUTUBE_API_KEY: ${{ secrets.VITE_YOUTUBE_API_KEY }}
        run: node scripts/auto-update-youtube-stats.mjs
      
      - name: Check for changes
        id: check_changes
        run: |
          if [ ! -f src/data/video-meta.json ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if git diff --quiet src/data/video-meta.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/video-meta.json
          git commit -m "🤖 auto: update YouTube stats ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
      
      - name: Report status
        run: |
          echo "========================================"
          if [ "${{ steps.check_changes.outputs.changed }}" == "true" ]; then
            echo "✅ video-meta.json 已更新并提交"
          else
            echo "ℹ️ video-meta.json 无变化"
          fi
          echo "========================================"
